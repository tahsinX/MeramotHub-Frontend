<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MeramotHub - Your trusted local home service booking platform in Bangladesh. Book verified electricians, plumbers, AC mechanics & more with transparent pricing and escrow-protected payments." />
    <meta name="keywords" content="home services, Bangladesh, electrician, plumber, AC mechanic, service booking, MeramotHub" />
    <meta name="author" content="MeramotHub" />
    <meta name="theme-color" content="#2563eb" />
    <title>MeramotHub — Trusted Home Services in Bangladesh</title>
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
